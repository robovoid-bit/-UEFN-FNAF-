<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Global Live Chat</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            background-color: #18181b;
            color: #efeff1;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .chat-container {
            width: 400px;
            height: 90vh;
            background: #0e0e10;
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
        }
        .chat-header {
            padding: 15px;
            background: #1f1f23;
            font-weight: bold;
            border-top-left-radius: 8px;
            border-top-right-radius: 8px;
            border-bottom: 1px solid #2f2f35;
            text-align: center;
        }
        .chat-messages {
            flex-grow: 1;
            padding: 15px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .message-row {
            font-size: 14px;
            line-height: 1.4;
            word-break: break-word;
        }
        .chat-input-area {
            padding: 15px;
            background: #1f1f23;
            border-bottom-left-radius: 8px;
            border-bottom-right-radius: 8px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .input-row {
            display: flex;
            gap: 8px;
        }
        input {
            background: #2a2a30;
            border: 2px solid transparent;
            border-radius: 4px;
            color: white;
            padding: 10px;
            font-size: 14px;
        }
        input:focus {
            border-color: #a970ff;
            outline: none;
        }
        #usernameInput { width: 30%; }
        #messageInput { flex-grow: 1; }
        button {
            background: #9146ff;
            color: white;
            border: none;
            border-radius: 4px;
            padding: 10px 15px;
            font-weight: bold;
            cursor: pointer;
        }
        button:hover { background: #772ce8; }
        button:disabled { background: #444; cursor: not-allowed; }
    </style>
</head>
<body>

<div class="chat-container">
    <div class="chat-header">STREAM CHAT (GITHUB PORTAL)</div>
    <div class="chat-messages" id="chatBox"></div>
    
    <div class="chat-input-area">
        <div class="input-row">
            <input type="text" id="usernameInput" placeholder="User" value="User">
            <input type="text" id="messageInput" placeholder="Send a message" autocomplete="off">
            <button id="sendBtn">Chat</button>
        </div>
    </div>
</div>

<script>
    const chatBox = document.getElementById("chatBox");
    const usernameInput = document.getElementById("usernameInput");
    const messageInput = document.getElementById("messageInput");
    const sendBtn = document.getElementById("sendBtn");

    // PASTE YOUR GOOGLE SCRIPT URL HERE (Keep the quotes around it!)
    const GOOGLE_APP_URL = "https://script.google.com/macros/s/AKfycbyAhTe6DJ8IuOxfMwoFWghJa-B1d0iLsCTdKWrPLLCYmbmoZKXM9A2LVujOPv-WUZt4/exec";

    // Function to read chat data from the Google Script database
    function fetchChatMessages() {
        fetch(GOOGLE_APP_URL)
            .then(response => response.json())
            .then(textStrings => {
                chatBox.innerHTML = "";
                textStrings.forEach(text => {
                    const row = document.createElement("div");
                    row.className = "message-row";
                    row.innerHTML = `<span>${escapeHTML(text)}</span>`;
                    chatBox.appendChild(row);
                });
                chatBox.scrollTop = chatBox.scrollHeight;
            })
            .catch(error => console.error("Error reading chat:", error));
    }

    // Function to write chat data down into your Google Sheet
    function sendMessage() {
        const username = usernameInput.value.trim();
        const text = messageInput.value.trim();

        if (!username || !text) return;

        sendBtn.disabled = true;
        messageInput.value = ""; 

        const formData = new URLSearchParams();
        formData.append("Username", username);
        formData.append("Action", text);

        fetch(GOOGLE_APP_URL, {
            method: "POST",
            body: formData,
            headers: {
                "Content-Type": "application/x-www-form-urlencoded"
            }
        })
        .then(() => {
            sendBtn.disabled = false;
            fetchChatMessages(); // Instantly update view
        })
        .catch(error => {
            console.error("Error sending message:", error);
            sendBtn.disabled = false;
        });
    }

    sendBtn.addEventListener("click", sendMessage);
    messageInput.addEventListener("keypress", (e) => { if (e.key === "Enter") sendMessage(); });

    function escapeHTML(str) {
        return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
    }

    // Background loop checks for fresh messages from your database sheet every 3 seconds
    fetchChatMessages();
    setInterval(fetchChatMessages, 3000);
</script>

</body>
</html>
