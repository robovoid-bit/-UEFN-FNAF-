<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Google Sheets Logger</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 50px;
            background-color: #f4f4f9;
            color: #333;
        }
        .container {
            max-width: 400px;
            background: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        h2 {
            margin-top: 0;
        }
        .input-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 10px;
            background-color: #28a745;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            cursor: pointer;
        }
        button:hover {
            background-color: #218838;
        }
        #statusMessage {
            margin-top: 15px;
            font-weight: bold;
            text-align: center;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Perform Action</h2>
    
    <div class="input-group">
        <label for="usernameInput">Username</label>
        <input type="text" id="usernameInput" placeholder="Enter your name" value="Player123">
    </div>

    <div class="input-group">
        <label for="actionInput">Action Text</label>
        <input type="text" id="actionInput" placeholder="e.g., Pressed Button, Saved Game" value="Completed Level 5">
    </div>

    <button id="actionButton">Submit Action to Sheet</button>
    
    <div id="statusMessage"></div>
</div>

<script>
    // Your live Google Web App Deployment URL
    const GOOGLE_APP_URL = "https://google.com";

    // Grab UI Elements
    const actionButton = document.getElementById("actionButton");
    const usernameInput = document.getElementById("usernameInput");
    const actionInput = document.getElementById("actionInput");
    const statusMessage = document.getElementById("statusMessage");

    // The function that automatically edits your spreadsheet
    function logActionToSheet(username, actionText) {
        statusMessage.style.color = "orange";
        statusMessage.innerText = "Sending data...";
        actionButton.disabled = true;

        const formData = new URLSearchParams();
        
        // These keys must match your Google Sheet Row 1 headers exactly!
        formData.append("Username", username);
        formData.append("Action", actionText);

        // Send data silently in the background
        fetch(GOOGLE_APP_URL, {
            method: "POST",
            body: formData,
            headers: {
                "Content-Type": "application/x-www-form-urlencoded"
            }
        })
        .then(response => response.json())
        .then(data => {
            console.log("Spreadsheet successfully updated!", data);
            statusMessage.style.color = "green";
            statusMessage.innerText = "Success! Sheet updated.";
            actionButton.disabled = false;
        })
        .catch(error => {
            console.error("Error sending data to spreadsheet:", error);
            statusMessage.style.color = "red";
            statusMessage.innerText = "Failed to update sheet.";
            actionButton.disabled = false;
        });
    }

    // Event Listener for the button click
    actionButton.addEventListener("click", () => {
        const username = usernameInput.value.trim();
        const actionText = actionInput.value.trim();

        if (username === "" || actionText === "") {
            statusMessage.style.color = "red";
            statusMessage.innerText = "Please fill out both fields.";
            return;
        }

        // Trigger the automatic edit
        logActionToSheet(username, actionText);
    });
</script>

</body>
</html>
